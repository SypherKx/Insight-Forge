version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: insightforge-backend
    ports:
      - "8000:8000"
    volumes:
      - ./insightforge.db:/app/insightforge.db
      - ./uploads:/app/uploads
      # Uncomment to use a local external vector DB if configured later
      #- ./chroma_db:/app/chroma_db
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./insightforge.db
      - UPLOAD_DIR=./uploads
      # Add your Groq API key by providing a .env file or inline here:
      # - GROQ_API_KEY=${GROQ_API_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: insightforge-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    # Inject backend API URL at build time using the env args in dockerfile or Vite environment variables
    restart: unless-stopped

volumes:
  uploads:
  insightforge_data:
